<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" width="1440" height="980" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1440" height="980" fill="#f8fafc"/>

  <!-- Topbar Header -->
  <rect x="0" y="0" width="1440" height="64" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="38" font-size="18" font-weight="700" fill="#0f172a">ERPNext 16 · 设计系统组件库与台账规范</text>
  <text x="490" y="38" font-size="13" font-weight="500" fill="#64748b"></text>
  <rect x="1240" y="16" width="160" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="1258" y="37" font-size="12" font-weight="600" fill="#1d4ed8"></text>

  <!-- Left Column: Design Tokens (Width: 380) -->
  <g transform="translate(40, 88)">
    <!-- Panel 1: Color Palette -->
    <rect width="380" height="420" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#card-shadow)"/>
    <text x="20" y="32" font-size="14" font-weight="700" fill="#0f172a">1. Color System (语义化色彩令牌)</text>

    <!-- Primary Blue -->
    <text x="20" y="60" font-size="11" font-weight="600" fill="#64748b">BRAND / ACTION</text>
    <rect x="20" y="70" width="50" height="28" rx="4" fill="#1e40af"/>
    <rect x="75" y="70" width="50" height="28" rx="4" fill="#2563eb"/>
    <rect x="130" y="70" width="50" height="28" rx="4" fill="#bfdbfe"/>
    <rect x="185" y="70" width="50" height="28" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="245" y="88" font-size="11" font-weight="600" fill="#2563eb">--color-blue-600</text>

    <!-- Slate Neutrals -->
    <text x="20" y="122" font-size="11" font-weight="600" fill="#64748b">NEUTRAL SLATE</text>
    <rect x="20" y="132" width="50" height="28" rx="4" fill="#0f172a"/>
    <rect x="75" y="132" width="50" height="28" rx="4" fill="#334155"/>
    <rect x="130" y="132" width="50" height="28" rx="4" fill="#64748b"/>
    <rect x="185" y="132" width="50" height="28" rx="4" fill="#cbd5e1"/>
    <text x="245" y="150" font-size="11" font-weight="600" fill="#0f172a">--slate-950 / 700</text>

    <!-- Semantic Status -->
    <text x="20" y="184" font-size="11" font-weight="600" fill="#64748b">SEMANTIC / STATUS</text>
    <!-- Success Green -->
    <rect x="20" y="194" width="100" height="28" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="32" y="212" font-size="11" font-weight="600" fill="#15803d">已过账 (Success)</text>
    <!-- Draft Amber -->
    <rect x="130" y="194" width="100" height="28" rx="4" fill="#fffbeb" stroke="#fde68a"/>
    <text x="146" y="212" font-size="11" font-weight="600" fill="#b45309">草稿 (Draft)</text>
    <!-- Danger Red -->
    <rect x="240" y="194" width="100" height="28" rx="4" fill="#fef2f2" stroke="#fecaca"/>
    <text x="254" y="212" font-size="11" font-weight="600" fill="#b91c1c">异常 (Danger)</text>

    <!-- Spacing & Geometry Scale -->
    <text x="20" y="256" font-size="11" font-weight="600" fill="#64748b">SPACING RHYTHM (4px BASE)</text>
    <rect x="20" y="268" width="16" height="16" fill="#2563eb" opacity="0.2"/>
    <text x="44" y="281" font-size="11" fill="#334155">4px (1)</text>
    <rect x="95" y="268" width="20" height="20" fill="#2563eb" opacity="0.4"/>
    <text x="122" y="281" font-size="11" fill="#334155">8px (2)</text>
    <rect x="175" y="268" width="24" height="24" fill="#2563eb" opacity="0.6"/>
    <text x="206" y="281" font-size="11" fill="#334155">12px (3)</text>
    <rect x="260" y="268" width="28" height="28" fill="#2563eb" opacity="0.8"/>
    <text x="295" y="281" font-size="11" fill="#334155">16px (4)</text>

    <!-- Radius & Heights -->
    <text x="20" y="330" font-size="11" font-weight="600" fill="#64748b">COMPONENT HEIGHTS &amp; RADII</text>
    <rect x="20" y="342" width="150" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="32" y="362" font-size="11" fill="#334155">Compact Cell: 32px</text>
    <rect x="180" y="342" width="170" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="194" y="365" font-size="11" fill="#334155">Standard Control: 36px</text>
  </g>

  <!-- Left Column: Typography -->
  <g transform="translate(40, 528)">
    <rect width="380" height="410" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#card-shadow)"/>
    <text x="20" y="32" font-size="14" font-weight="700" fill="#0f172a">2. Typography Standards (字阶规范)</text>

    <text x="20" y="70" font-size="20" font-weight="700" fill="#0f172a">Page Title 20px / Bold (700)</text>
    <text x="20" y="92" font-size="11" fill="#64748b">Workbench main title &amp; module banner</text>

    <text x="20" y="132" font-size="14" font-weight="600" fill="#0f172a">Section Title 14px / SemiBold (600)</text>
    <text x="20" y="154" font-size="11" fill="#64748b">Card titles, sub-modules, panel headers</text>

    <text x="20" y="194" font-size="12" font-weight="500" fill="#334155">Body / Control Text 12px / Medium (500)</text>
    <text x="20" y="216" font-size="11" fill="#64748b">Standard table rows, form inputs, button text</text>

    <text x="20" y="256" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.5">HEADER BADGE 10px / BOLD (ALL CAPS)</text>
    <text x="20" y="278" font-size="11" fill="#64748b">Dual-line table header top category tag</text>

    <text x="20" y="320" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#0f172a">Tabular Numbers: ¥ 1,250,890.00</text>
    <text x="20" y="342" font-size="11" fill="#64748b">Strict tabular-nums, right-aligned figures</text>
  </g>

  <!-- Right Column: Interactive Components & Workbench (Width: 940) -->
  <g transform="translate(460, 88)">
    <!-- Top Interactive Controls Bar -->
    <rect width="940" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#card-shadow)"/>
    <text x="20" y="30" font-size="14" font-weight="700" fill="#0f172a">3. Controls &amp; Segmented Navigation (交互组件库)</text>

    <!-- Buttons -->
    <rect x="20" y="52" width="100" height="36" rx="6" fill="#2563eb"/>
    <text x="38" y="74" font-size="12" font-weight="600" fill="#ffffff">新建单据</text>

    <rect x="130" y="52" width="100" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="148" y="74" font-size="12" font-weight="600" fill="#334155">导出报表</text>

    <rect x="240" y="52" width="110" height="36" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="256" y="74" font-size="12" font-weight="600" fill="#15803d">过账生效 (POST)</text>

    <!-- Segmented Control (3-Tier Lifecycle) -->
    <rect x="390" y="52" width="330" height="36" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="392" y="54" width="105" height="32" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>
    <text x="414" y="74" font-size="12" font-weight="700" fill="#2563eb">进行中 (18)</text>
    <text x="515" y="74" font-size="12" font-weight="500" fill="#64748b">待提交草稿 (3)</text>
    <text x="630" y="74" font-size="12" font-weight="500" fill="#64748b">已结清 (124)</text>

    <!-- Input Box -->
    <rect x="750" y="52" width="170" height="36" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="762" y="74" font-size="12" fill="#0f172a">搜索物料编号...</text>
  </g>

  <!-- Right Column: KPI Cards Row (Width: 940) -->
  <g transform="translate(460, 228)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="300" height="110" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#card-shadow)"/>
    <text x="20" y="28" font-size="12" font-weight="600" fill="#64748b">本月出库物料总额 (Outflow)</text>
    <text x="20" y="68" font-family="ui-monospace, monospace" font-size="24" font-weight="700" fill="#0f172a">¥ 428,950.00</text>
    <text x="20" y="94" font-size="11" font-weight="600" fill="#15803d">+12.4% 较上月环比</text>
    <text x="160" y="94" font-size="11" fill="#64748b">预算上限: 50.00万</text>

    <!-- Card 2 -->
    <rect x="320" y="0" width="300" height="110" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#card-shadow)"/>
    <text x="340" y="28" font-size="12" font-weight="600" fill="#64748b">当前在册在库 SKU 总数</text>
    <text x="340" y="68" font-family="ui-monospace, monospace" font-size="24" font-weight="700" fill="#0f172a">1,428 个</text>
    <text x="340" y="94" font-size="11" font-weight="600" fill="#2563eb">100% 动态盘点覆盖</text>
    <text x="480" y="94" font-size="11" fill="#64748b">0 呆滞积压</text>

    <!-- Card 3 -->
    <rect x="640" y="0" width="300" height="110" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#card-shadow)"/>
    <text x="660" y="28" font-size="12" font-weight="600" fill="#64748b">待核定财务平账单据</text>
    <text x="660" y="68" font-family="ui-monospace, monospace" font-size="24" font-weight="700" fill="#b45309">3 笔</text>
    <text x="660" y="94" font-size="11" font-weight="600" fill="#b45309">需前置校验归档</text>
    <text x="790" y="94" font-size="11" fill="#64748b">四柱守恒核对中</text>
  </g>

  <!-- Right Column: High Density Four-Pillar Table (Signature ERP Component) -->
  <g transform="translate(460, 360)">
    <rect width="940" height="578" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#card-shadow)"/>
    <text x="20" y="32" font-size="14" font-weight="700" fill="#0f172a">4. 标准台账大宽表规范</text>
    <text x="440" y="32" font-size="12" fill="#64748b">单层语义化复合表头 · 纯净等宽数值 · 零药丸包裹</text>

    <!-- Table Container -->
    <g transform="translate(20, 52)">
      <!-- Table Header (Single-Tier Dual-Line) -->
      <rect width="900" height="48" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Col 1: Sticky ID -->
      <rect x="12" y="8" width="28" height="14" rx="3" fill="#e2e8f0"/>
      <text x="16" y="18" font-size="9" font-weight="700" fill="#475569">序号</text>
      <text x="12" y="38" font-size="12" font-weight="700" fill="#0f172a">序号</text>

      <!-- Col 2: Code -->
      <rect x="55" y="8" width="36" height="14" rx="3" fill="#e2e8f0"/>
      <text x="59" y="18" font-size="9" font-weight="700" fill="#475569">编码</text>
      <text x="55" y="38" font-size="12" font-weight="700" fill="#0f172a">物料编码</text>

      <!-- Col 3: Name -->
      <rect x="170" y="8" width="36" height="14" rx="3" fill="#e2e8f0"/>
      <text x="174" y="18" font-size="9" font-weight="700" fill="#475569">DESC</text>
      <text x="170" y="38" font-size="12" font-weight="700" fill="#0f172a">物料名称与规格</text>

      <!-- Col 4: Opening -->
      <rect x="410" y="8" width="55" height="14" rx="3" fill="#e2e8f0"/>
      <text x="414" y="18" font-size="9" font-weight="700" fill="#475569">OPENING</text>
      <text x="410" y="38" font-size="12" font-weight="700" fill="#0f172a">期初结存</text>

      <!-- Col 5: Inflow -->
      <rect x="540" y="8" width="48" height="14" rx="3" fill="#dcfce7"/>
      <text x="544" y="18" font-size="9" font-weight="700" fill="#15803d">INFLOW</text>
      <text x="540" y="38" font-size="12" font-weight="700" fill="#15803d">本期入库 (+)</text>

      <!-- Col 6: Outflow -->
      <rect x="670" y="8" width="56" height="14" rx="3" fill="#fef3c7"/>
      <text x="674" y="18" font-size="9" font-weight="700" fill="#b45309">OUTFLOW</text>
      <text x="670" y="38" font-size="12" font-weight="700" fill="#b45309">本期出库 (-)</text>

      <!-- Col 7: Closing -->
      <rect x="800" y="8" width="54" height="14" rx="3" fill="#dbeafe"/>
      <text x="804" y="18" font-size="9" font-weight="700" fill="#1d4ed8">CLOSING</text>
      <text x="800" y="38" font-size="12" font-weight="700" fill="#1d4ed8">期末结余</text>

      <!-- Row 1 -->
      <rect y="48" width="900" height="44" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
      <text x="16" y="75" font-size="12" fill="#64748b">01</text>
      <text x="55" y="75" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#2563eb">MAT-2026-081</text>
      <text x="170" y="75" font-size="12" font-weight="500" fill="#0f172a">冷轧卷板 SPCC-1.2mm</text>
      <text x="410" y="75" font-family="ui-monospace, monospace" font-size="12" fill="#334155">120.00 Ton</text>
      <text x="540" y="75" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#15803d">+ 40.00 Ton</text>
      <text x="670" y="75" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#b45309">- 25.00 Ton</text>
      <text x="800" y="75" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#0f172a">135.00 Ton</text>

      <!-- Row 2 -->
      <rect y="92" width="900" height="44" fill="#f8fafc" stroke="#f1f5f9" stroke-width="1"/>
      <text x="16" y="119" font-size="12" fill="#64748b">02</text>
      <text x="55" y="119" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#2563eb">MAT-2026-082</text>
      <text x="170" y="119" font-size="12" font-weight="500" fill="#0f172a">铝合金锭 A380 铸造级</text>
      <text x="410" y="119" font-family="ui-monospace, monospace" font-size="12" fill="#334155">450.00 Kg</text>
      <text x="540" y="119" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#15803d">+ 100.00 Kg</text>
      <text x="670" y="119" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#b45309">- 80.00 Kg</text>
      <text x="800" y="119" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#0f172a">470.00 Kg</text>

      <!-- Row 3 -->
      <rect y="136" width="900" height="44" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
      <text x="16" y="163" font-size="12" fill="#64748b">03</text>
      <text x="55" y="163" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#2563eb">MAT-2026-095</text>
      <text x="170" y="163" font-size="12" font-weight="500" fill="#0f172a">高强度紧固件螺栓 M8*45</text>
      <text x="410" y="163" font-family="ui-monospace, monospace" font-size="12" fill="#334155">12,500.00 Nos</text>
      <text x="540" y="163" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#15803d">+ 5,000.00 Nos</text>
      <text x="670" y="163" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#b45309">- 3,200.00 Nos</text>
      <text x="800" y="163" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#0f172a">14,300.00 Nos</text>

      <!-- Row 4 -->
      <rect y="180" width="900" height="44" fill="#f8fafc" stroke="#f1f5f9" stroke-width="1"/>
      <text x="16" y="207" font-size="12" fill="#64748b">04</text>
      <text x="55" y="207" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#2563eb">MAT-2026-104</text>
      <text x="170" y="207" font-size="12" font-weight="500" fill="#0f172a">精密密封橡胶圈 O-Ring</text>
      <text x="410" y="207" font-family="ui-monospace, monospace" font-size="12" fill="#334155">3,200.00 个</text>
      <text x="540" y="207" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#15803d">+ 800.00 个</text>
      <text x="670" y="207" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#b45309">- 1,150.00 个</text>
      <text x="800" y="207" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#0f172a">2,850.00 个</text>

      <!-- Table Foot: Sticky Foot (Conservation Total) -->
      <rect y="224" width="900" height="46" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="16" y="252" font-size="12" font-weight="700" fill="#0f172a">合计</text>
      <text x="290" y="252" font-size="11" font-weight="600" fill="#15803d">[期初 16,270 + 流入 5,940 - 流出 4,455 = 期末 17,755] 守恒平账 OK</text>
      <text x="800" y="252" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#1d4ed8">17,755.00 Total</text>
    </g>

    <!-- Guidance Notes -->
    <g transform="translate(20, 360)">
      <rect width="900" height="180" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="20" y="28" font-size="12" font-weight="700" fill="#1e40af">Figma 与 ERPNext 16 交互规范落地要点：</text>
      <text x="20" y="52" font-size="11" fill="#334155">1. 单层复合表头：使用单层 AutoLayout，上方分类 Capsule 标签（9px/700）+ 下方列名（12px/700），杜绝多层表头横滚漂移。</text>
      <text x="20" y="74" font-size="11" fill="#334155">2. 纯净度量列：所有数量与金额必须带法定单位（如 Nos, Kg, Ton, ¥），等宽字体排版，绝不在单元格加多余药丸边框。</text>
      <text x="20" y="96" font-size="11" fill="#334155">3. 严禁装饰性 Emoji：状态一律采用高对比度状态色块或微图标；按钮采用严谨的企业级色彩层级。</text>
      <text x="20" y="118" font-size="11" fill="#334155">4. 三梯队状态排序：草稿置顶 (Yellow) -> 进行中活跃单据 (Blue/White) -> 已结清/作废沉底 (Gray)。</text>
      <text x="20" y="140" font-size="11" fill="#334155">5. 原位闭环录单：看账即办单，直接提供提交生效路径（POST 默认过账）。</text>
    </g>
  </g>
</svg>
